name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: payments
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payments" --health-interval 5s --health-timeout 3s --health-retries 10
      rabbitmq:
        image: rabbitmq:3.13-alpine
        ports: ["5672:5672"]
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Create service databases
        run: |
          for db in ingest processor reconciliation; do
            PGPASSWORD=payments psql -h localhost -U payments -d postgres -c "CREATE DATABASE $db"
          done
      - name: Build, unit and integration tests
        run: mvn -B verify -Pit

  docker:
    runs-on: ubuntu-latest
    needs: build
    strategy:
      matrix:
        service: [ingest-service, processor-service, reconciliation-service]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build --build-arg SERVICE=${{ matrix.service }} -t ${{ matrix.service }}:ci .
