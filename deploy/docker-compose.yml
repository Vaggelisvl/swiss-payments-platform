# docker compose -f deploy/docker-compose.yml up --build
name: swiss-payments-platform

x-service: &service
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
    rabbitmq:
      condition: service_healthy
  environment: &env
    PORT: "8080"
    DB_USER: payments
    DB_PASSWORD: payments
    RABBIT_HOST: rabbitmq

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    volumes:
      - ./postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "15672:15672"   # management UI (guest / guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  ingest:
    <<: *service
    build:
      context: ..
      args:
        SERVICE: ingest-service
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/ingest
    ports:
      - "8081:8080"

  processor:
    <<: *service
    build:
      context: ..
      args:
        SERVICE: processor-service
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/processor
    ports:
      - "8082:8080"

  reconciliation:
    <<: *service
    build:
      context: ..
      args:
        SERVICE: reconciliation-service
    environment:
      <<: *env
      DB_URL: jdbc:postgresql://postgres:5432/reconciliation
    ports:
      - "8083:8080"

  assistant:
    restart: unless-stopped
    build:
      context: ..
      args:
        SERVICE: exception-assistant
    environment:
      PORT: "8080"
      # Optional: without a key the assistant answers from its built-in catalogue.
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "8084:8080"

  ui:
    restart: unless-stopped
    build:
      context: ../ui
    ports:
      - "3000:80"
    depends_on:
      - ingest
      - processor
      - reconciliation
      - assistant

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - ingest
      - processor
      - reconciliation
      - assistant

volumes:
  postgres-data:
